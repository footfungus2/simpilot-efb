# Validate changes before publishing an unsigned IPA for TrollStore or SideStore.
# Pull requests build without a write token; publishing runs separately on trusted main pushes.
name: Build IPA

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-ipa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            bridge/package-lock.json
            sim-package/package-lock.json
      - name: Check release packaging
        run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - name: Check bridge
        working-directory: bridge
        run: |
          npm ci
          npm test
          npm run build
      - name: Check simulator panel
        working-directory: sim-package
        run: |
          npm ci
          npm test
          npm run typecheck
          npm run build

  installer:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check PowerShell installer syntax
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          foreach ($file in 'sim-package/build.ps1', 'scripts/package-pc.ps1', 'scripts/test-pc.ps1') {
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Join-Path $PWD $file), [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count) { throw ($errors | Out-String) }
          }
      - name: Check PC packaging and installer behavior
        shell: pwsh
        run: ./scripts/test-pc.ps1

  # The PC download: a portable SimPilot Bridge bundle (no Node.js install needed) and the ready-made chart panel.
  pc-package:
    needs: [checks, installer]
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            bridge/package-lock.json
            sim-package/package-lock.json
      - name: Build SimPilot Bridge portable bundle
        working-directory: bridge
        run: |
          npm ci
          npm run package:portable
      - name: Verify the bundled Node.js runtime signature
        shell: pwsh
        run: |
          $signature = Get-AuthenticodeSignature -LiteralPath 'bridge\dist\app\node.exe'
          if ($signature.Status -ne 'Valid') { throw "Bundled Node.js signature is $($signature.Status)." }
      - name: Build the chart panel
        working-directory: sim-package
        run: |
          npm ci
          npm run build
      - name: Stage SimPilot-for-PC.zip
        shell: pwsh
        run: ./scripts/package-pc.ps1 -OutDir release-pc
      - name: Upload PC package
        uses: actions/upload-artifact@v4
        with:
          name: SimPilot-for-PC
          path: release-pc/SimPilot-for-PC.zip
          if-no-files-found: error

  build:
    needs: [checks, installer]
    runs-on: macos-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 50
          persist-credentials: false

      - name: Show Xcode
        run: xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Build IPA
        run: ./scripts/build-ipa.sh

      - name: Test iPad app
        run: |
          device="$(xcrun simctl list devices available --json | python3 -c 'import json,sys; devices=json.load(sys.stdin)["devices"]; print(next(d["udid"] for group in devices.values() for d in group if d["name"].startswith("iPad")))')"
          xcodebuild test \
            -project ios/SimPilotEFB.xcodeproj \
            -scheme SimPilotEFB \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination "id=$device" \
            -derivedDataPath ios/build/tests \
            CODE_SIGNING_ALLOWED=YES CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=- DEVELOPMENT_TEAM=""

      - name: Stage release files
        run: |
          mkdir -p release-artifact
          cp SimPilotEFB.ipa ios/build/ipa/update.json release-artifact/

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: SimPilotEFB-ipa
          path: release-artifact/*
          if-no-files-found: error

  publish:
    needs: [build, pc-package]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 50
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: SimPilotEFB-ipa
          path: artifact
      - uses: actions/download-artifact@v4
        with:
          name: SimPilot-for-PC
          path: artifact
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ipa="artifact/SimPilotEFB.ipa"
          manifest="artifact/update.json"
          pc="artifact/SimPilot-for-PC.zip"
          version="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["version"])' "$manifest")"
          build="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["build"])' "$manifest")"
          head="$(gh api "repos/${GITHUB_REPOSITORY}/commits/main" --jq .sha)"
          if [[ "${GITHUB_SHA}" != "$head" ]]; then
            echo "Skipping publication: this commit is no longer the main branch head."
            exit 0
          fi
          tag="v${version}-build.${build}"
          short="${GITHUB_SHA::7}"
          {
            cat "docs/updates/${version}.md"
            echo
            echo "Build ${build} · commit \`${short}\` · $(date -u '+%-d %b %Y')"
            echo
            echo "### Install"
            echo
            echo "Requires iPadOS 15 or later and a compatible TrollStore or SideStore setup."
            echo
            echo "- **TrollStore:** download the IPA below, open it with TrollStore and tap **Install**."
            echo "- **SideStore:** download the IPA on the iPad and import it into SideStore to sign and install it."
            echo "  SideStore must be set up and able to install or refresh apps; see the [official guide](https://docs.sidestore.io/docs/installation/install)."
            echo
            echo "Keep the same installer and signing identity when updating to retain app data."
            echo
            echo "### Connect to MSFS 2024 (optional)"
            echo
            echo "On the PC, download **SimPilot-for-PC.zip**, choose **Extract All**, open **SimPilot for PC** and double-click"
            echo "**SimPilot Bridge** (nothing to install) for live aircraft position and Fenix A320 controls. Allow Private networks"
            echo "if Windows Firewall asks; it may call the app **Node.js JavaScript Runtime**. Keep both devices on the same local network."
            echo "For charts, follow **Read me.txt** for the optional panel and MSFS 2024 SDK, then restart the sim."
            echo "[Step-by-step guide](https://github.com/${GITHUB_REPOSITORY}#connect-to-msfs-2024)."
            echo
            echo "### Included"
            echo
            echo "- Enroute and airport maps, SimBrief flight planning, charts and annotations"
            echo "- Weather and VATSIM information"
            echo "- Optional updates and local diagnostics"
            echo
            echo "<sub>Unsigned build. Unofficial hobby project, not affiliated with Lufthansa Systems / Lido, Microsoft, Asobo, Fenix Simulations or VATSIM.</sub>"
          } > notes.md
          draft="$(gh release view "$tag" --json isDraft --jq .isDraft 2>/dev/null || true)"
          if [[ "$draft" == "false" ]]; then
            echo "Build ${build} is already published; leaving its assets unchanged."
            exit 0
          fi
          # Keep failed uploads hidden so the previous release remains available.
          if [[ "$draft" == "true" ]]; then
            gh release upload "$tag" "$ipa" "$manifest" "$pc" --clobber
          else
            gh release create "$tag" "$ipa" "$manifest" "$pc" \
              --target "${GITHUB_SHA}" --title "SimPilot EFB ${version}" \
              --notes-file notes.md --draft
          fi
          gh release edit "$tag" --title "SimPilot EFB ${version}" \
            --notes-file notes.md --draft=false --latest
